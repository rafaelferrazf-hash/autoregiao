<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem internet — AutoRegião</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
         background: #F7F6F3; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; text-align: center; color: #1A1917; }
  .caixa { max-width: 340px; }
  .marca { background: #1A1A1A; border-radius: 18px; padding: 18px 24px; margin-bottom: 20px; }
  .marca img { width: 100%; max-width: 220px; }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { font-size: 15px; color: #7A7670; line-height: 1.5; margin: 0 0 22px; }
  button { background: #FF6600; color: #fff; border: 0; border-radius: 10px; padding: 14px 26px; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="marca"><img src="logo.png" alt="AutoRegião"></div>
    <h1>Sem conexão com a internet</h1>
    <p>Confira o Wi-Fi ou os dados móveis e tente de novo. Os anúncios aparecem assim que a conexão voltar.</p>
    <button onclick="location.href='https://www.autoregiao.com.br/?origem=app'">Tentar de novo</button>
  </div>
</body>
</html>
